# Tests à chaque push sur main (sans construction ni publication).
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt -e .

      - name: Tests
        run: python -m pytest -p no:cacheprovider --junitxml=pytest.xml

      - name: Détail des tests en échec
        if: failure()
        run: python tools/ci_report.py pytest.xml
